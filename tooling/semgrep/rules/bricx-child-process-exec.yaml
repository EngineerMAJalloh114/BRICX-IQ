# Written for BRICX IQ (ADR 0043). ESLint has no rule for this. exec and
# execSync always run a shell; with a command built from data, or "sh -c"
# with a built string, that data can inject commands. Only calls to
# functions imported from (node:)child_process are checked.
rules:
  - id: bricx-child-process-exec
    languages: [typescript, javascript]
    severity: ERROR
    message: >-
      A shell command is built from a string that is not a literal. Use
      execFile/spawn with an argument array and no shell.
    metadata:
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
    patterns:
      - pattern-either:
          - pattern-inside: |
              import { ..., $F, ... } from "$CPMOD";
              ...
          - pattern-inside: |
              import * as $CP from "$CPMOD";
              ...
          - pattern-inside: |
              import $CP from "$CPMOD";
              ...
          - pattern-inside: |
              const { ..., $F, ... } = require("$CPMOD");
              ...
          - pattern-inside: |
              const $CP = require("$CPMOD");
              ...
      - metavariable-regex:
          metavariable: $CPMOD
          regex: ^(node:)?child_process$
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $CP.$F($CMD, ...)
                  - pattern: $F($CMD, ...)
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(exec|execSync)$
              - pattern-not: $CP.$F("...", ...)
              - pattern-not: $F("...", ...)
          - patterns:
              - pattern-either:
                  - pattern: $CP.$F($SH, [..., "-c", $CMD, ...], ...)
                  - pattern: $F($SH, [..., "-c", $CMD, ...], ...)
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(spawn|spawnSync|execFile|execFileSync)$
              - metavariable-regex:
                  metavariable: $SH
                  regex: ^["'`](/bin/|/usr/bin/)?(ba|z|da|k)?sh["'`]$
              - pattern-not: $CP.$F($SH, [..., "-c", "...", ...], ...)
              - pattern-not: $F($SH, [..., "-c", "...", ...], ...)
