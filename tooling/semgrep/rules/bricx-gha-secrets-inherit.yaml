# Written for BRICX IQ (ADR 0043). Not covered by the ADR 0031 guard.
rules:
  - id: bricx-gha-secrets-inherit
    languages: [yaml]
    severity: ERROR
    message: >-
      "secrets: inherit" hands every repository and organisation secret to
      the called workflow. Pass only the secrets it needs, by name.
    metadata:
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      bricx-rule: ADR 0031
    paths:
      include:
        - "*.yml"
        - "*.yaml"
    pattern: "secrets: inherit"
