# Known-good: every ecosystem waits 7 days (ADR 0044).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7 # ADR 0044
      semver-major-days: 14
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: "github-actions"
    directories: [/, /.github/actions/setup]
    cooldown:
      default-days: 7
