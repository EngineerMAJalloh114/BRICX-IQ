# A *-init service publishing a port.
name: fixture

services:
  store:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    healthcheck:
      test:
        - CMD
        - /bin/check
  store-init:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    profiles:
      - init
    entrypoint:
      - sh
      - /init/run.sh
    volumes:
      - ./init:/init:ro
    depends_on:
      store:
        condition: service_started
    restart: "no"
    ports:
      - "127.0.0.1:9999:9999"
