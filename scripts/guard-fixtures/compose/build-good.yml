# A service built from a Dockerfile inside the compose directory (ADR 0060).
name: fixture

services:
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/80 &&
          head -n 1 <&3 | grep -q 200
      interval: 10s
