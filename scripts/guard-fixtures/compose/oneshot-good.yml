# A one-shot *-init service: profile init, restart "no", depends_on, no ports, no healthcheck (ADR 0036).
name: fixture

services:
  store:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    healthcheck:
      test:
        - CMD
        - /bin/check
  store-init:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    profiles:
      - init
    entrypoint:
      - sh
      - /init/run.sh
    volumes:
      - ./init:/init:ro
    depends_on:
      store:
        condition: service_started
    restart: "no"
