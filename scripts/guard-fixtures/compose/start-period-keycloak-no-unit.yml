# A bare number is not a compose duration: fails closed (keycloak floor 300s; P2-01c, ADR 0042).
name: fixture

services:
  keycloak:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    healthcheck:
      test:
        - CMD
        - /bin/check
      interval: 10s
      start_period: 300
