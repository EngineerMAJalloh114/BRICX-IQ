# An interpolated value cannot be checked: fails closed (keycloak floor 240s; P2-01c, ADR 0042).
name: fixture

services:
  keycloak:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    healthcheck:
      test:
        - CMD
        - /bin/check
      interval: 10s
      start_period: ${START_PERIOD:-240s}
