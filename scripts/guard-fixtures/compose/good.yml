# Two services in the house style: pinned, loopback ports, healthchecks.
name: fixture

services:
  db:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    command:
      - db
      - -c
      - wal_level=logical
    ports:
      - "127.0.0.1:5432:5432"
      - 127.0.0.1:8080:8080/tcp
    volumes:
      - db-data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/80 &&
          head -n 1 <&3 | grep -q 200
      interval: 10s
  web:
    image: example/other:2.0.0@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - /bin/check
      start_period: 10s

volumes:
  db-data:
    labels:
      com.bricx.stack: local-dev
