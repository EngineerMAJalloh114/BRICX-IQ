# A *-init service that names nothing it initialises.
name: fixture

services:
  store:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    healthcheck:
      test:
        - CMD
        - /bin/check
  store-init:
    image: example/listed:1.2.3@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    profiles:
      - init
    entrypoint:
      - sh
      - /init/run.sh
    volumes:
      - ./init:/init:ro
    restart: "no"
