# PowerSync Open Edition, local development only (ADR 0034, ADR 0035).
# Replication connects as powersync_repl (REPLICATION, BYPASSRLS, SELECT on
# published tables only) to the `powersync` publication, which starts EMPTY:
# migrations add each table together with its GRANT SELECT. Bucket storage
# connects as powersync_storage_owner. The bootstrap superuser is never used.
# Client auth (token signing with jose) arrives in P5.
replication:
  connections:
    - type: postgresql
      uri: !env PS_DATA_SOURCE_URI
      sslmode: disable

storage:
  type: postgresql
  uri: !env PS_STORAGE_URI
  sslmode: disable

port: 8080

# Admin API token, used only by healthcheck.mjs (diagnostics endpoint).
api:
  tokens:
    - !env PS_API_TOKEN

# PLACEHOLDER: the real sync streams arrive with the sync work (ADR 0002).
sync_config:
  content: |
    bucket_definitions:
      placeholder:
        data: []

telemetry:
  disable_telemetry_sharing: true
